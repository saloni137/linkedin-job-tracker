<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Job Tracker</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Job Tracker</h1>
      <span id="count" class="muted"></span>
    </header>

    <section class="settings">
      <label for="webhook">Apps Script web-app URL</label>
      <p class="muted hint">Not your sheet link. Deploy <code>apps-script/Code.gs</code> from inside your sheet (Extensions › Apps Script › Deploy › Web app) and paste the URL ending in <code>/exec</code>.</p>
      <div class="row">
        <input id="webhook" type="url" placeholder="https://script.google.com/macros/s/.../exec" />
        <button id="save">Save</button>
        <button id="test" class="secondary">Test</button>
      </div>
    </section>

    <section class="actions">
      <button id="log">Log this job as applied</button>
      <button id="import" class="secondary" title="Open LinkedIn > My Jobs > Applied, then click">Import applied jobs from this page</button>
      <button id="sync" class="secondary">Sync to Sheet</button>
      <button id="csv" class="secondary">Download CSV</button>
    </section>

    <p id="status" class="muted"></p>

    <ul id="applications"></ul>

    <script src="popup.js"></script>
  </body>
</html>
